<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">WAYLINE RADIO — Multi-company radio network</title>
<desc id="desc">Animated product illustration of a trucking company radio network with separate CNU and ETL stations, listener player, central control center, music rights gate, reviewed RSS information, multilingual announcements and optional text to speech pipeline.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071513"/><stop offset=".55" stop-color="#0a1d1a"/><stop offset="1" stop-color="#09131a"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8af0d6"/><stop offset="1" stop-color="#36bfae"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#91c9ff"/><stop offset="1" stop-color="#548eea"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#152c29"/><stop offset="1" stop-color="#10201f"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="13" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
 <style>
 .t{font-family:Inter,Arial,sans-serif;fill:#f0fbf7}.m{font-family:Inter,Arial,sans-serif;fill:#91aaa3}.tiny{font-size:11px;letter-spacing:1.7px;font-weight:750}.small{font-size:14px}.label{font-size:17px;font-weight:750}.panel{fill:url(#panel);stroke:#29483f;stroke-width:1.4}.node{fill:#102a26;stroke:#3d776a;stroke-width:1.5}.mint{fill:#85eed5}.blue{fill:#91c9ff}.wire{fill:none;stroke:#365c51;stroke-width:3;stroke-linecap:round}.dash{stroke-dasharray:8 12}
 </style>
</defs>
<rect width="1440" height="1120" rx="30" fill="url(#bg)"/>
<circle cx="1250" cy="120" r="280" fill="#42d3b6" opacity=".055"/>
<circle cx="110" cy="1000" r="250" fill="#538eea" opacity=".045"/>
<!-- Header -->
<g transform="translate(68 54)">
 <rect width="58" height="58" rx="18" fill="url(#mint)"/>
 <path d="M12 15h34v8H21v7h22v8H21v14h-9z" fill="#09211c"/>
 <path d="M38 34l13 8-13 8z" fill="#09211c"/>
 <text x="76" y="37" class="t" font-size="32" font-weight="900" letter-spacing="-1">WAYLINE</text>
 <text x="78" y="54" class="mint tiny" font-size="9">RADIO NETWORK</text>
</g>
<text x="1370" y="88" text-anchor="end" class="mint tiny">MULTI-COMPANY INTERNET RADIO</text>
<text x="68" y="222" class="t" font-size="66" font-weight="850" letter-spacing="-2.8">Your road.</text>
<text x="68" y="294" font-size="66" font-weight="850" letter-spacing="-2.8" fill="url(#mint)">Your company radio.</text>
<text x="72" y="339" class="m" font-size="20">One platform. Separate company stations. Information with editorial control.</text>
<!-- Main network card -->
<rect x="58" y="382" width="1324" height="420" rx="26" fill="#091a18" stroke="#29483f" filter="url(#shadow)"/>
<text x="88" y="426" class="mint tiny">01 / MULTI-TENANT RADIO NETWORK</text>
<text x="1350" y="426" text-anchor="end" class="m tiny">ILLUSTRATIVE PRODUCT FLOW · NOT A LIVE BROADCAST</text>
<!-- central control center -->
<g transform="translate(555 475)">
 <rect width="330" height="250" rx="22" fill="#132b27" stroke="#68cdb4" stroke-width="2"/>
 <rect x="24" y="24" width="282" height="42" rx="10" fill="#1c3d35"/>
 <circle cx="45" cy="45" r="5" fill="#82efd4"/>
 <text x="62" y="50" class="t small" font-weight="750">WAYLINE CONTROL CENTER</text>
 <text x="28" y="100" class="m tiny">COMPANY WORKSPACES</text>
 <rect x="26" y="116" width="132" height="54" rx="11" fill="#173d34" stroke="#4a9e87"/>
 <text x="92" y="139" text-anchor="middle" class="mint label">CNU</text><text x="92" y="157" text-anchor="middle" class="m" font-size="10">Station + Library</text>
 <rect x="172" y="116" width="132" height="54" rx="11" fill="#172e48" stroke="#548eea"/>
 <text x="238" y="139" text-anchor="middle" class="blue label">ETL</text><text x="238" y="157" text-anchor="middle" class="m" font-size="10">Station + Library</text>
 <rect x="26" y="188" width="278" height="38" rx="9" fill="#0d211f" stroke="#31564b"/>
 <text x="165" y="212" text-anchor="middle" class="mint small">Role-based access · Tenant isolation</text>
</g>
<!-- station boxes -->
<g transform="translate(105 492)">
 <rect width="330" height="190" rx="20" class="node"/>
 <circle cx="48" cy="47" r="23" fill="#1c4b3e"/><text x="48" y="54" text-anchor="middle" class="t label">C</text>
 <text x="84" y="43" class="t label">CNU RADIO</text><text x="84" y="64" class="m small">Company station</text>
 <path d="M31 112h15l9-23 15 48 14-33 10 8h28" fill="none" stroke="#84efd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="31" y="162" class="mint tiny">SEPARATE COMPANY SPACE</text>
 <text x="300" y="162" text-anchor="end" class="m" font-size="11">Stream URL required</text>
</g>
<g transform="translate(1005 492)">
 <rect width="330" height="190" rx="20" fill="#11243a" stroke="#4c77a8" stroke-width="1.5"/>
 <circle cx="48" cy="47" r="23" fill="#1b3d62"/><text x="48" y="54" text-anchor="middle" class="t label">E</text>
 <text x="84" y="43" class="t label">ETL RADIO</text><text x="84" y="64" class="m small">Company station</text>
 <path d="M31 112h15l9-23 15 48 14-33 10 8h28" fill="none" stroke="#91c9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="31" y="162" class="blue tiny">SEPARATE COMPANY SPACE</text>
 <text x="300" y="162" text-anchor="end" class="m" font-size="11">Stream URL required</text>
</g>
<!-- connections -->
<path d="M435 585H555 M885 585H1005" class="wire"/>
<path d="M435 585H555 M885 585H1005" class="wire dash"/>
<circle r="7" fill="#8af0d6" filter="url(#glow)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M435 585H555"/></circle>
<circle r="7" fill="#91c9ff" filter="url(#glow)"><animateMotion dur="3.6s" begin="1.1s" repeatCount="indefinite" path="M885 585H1005"/></circle>
<!-- listener strip -->
<rect x="58" y="830" width="1324" height="230" rx="24" class="panel"/>
<text x="88" y="873" class="mint tiny">02 / FROM CONTENT TO THE ROAD</text>
<!-- mini flow cards -->
<g transform="translate(88 900)">
 <rect width="210" height="112" rx="15" fill="#102722" stroke="#397361"/>
 <text x="18" y="30" class="mint tiny">LISTENER PWA</text>
 <text x="18" y="58" class="t label">Choose station</text><text x="18" y="82" class="m small">Mobile-first · 3 languages</text><text x="18" y="100" class="m" font-size="10">Installable web app</text>
</g>
<g transform="translate(320 900)">
 <rect width="210" height="112" rx="15" fill="#102722" stroke="#397361"/>
 <text x="18" y="30" class="mint tiny">AUDIO PLAYER</text>
 <text x="18" y="58" class="t label">Play the stream</text><text x="18" y="82" class="m small">Browser audio controls</text><text x="18" y="100" class="m" font-size="10">External stream endpoint</text>
</g>
<g transform="translate(552 900)">
 <rect width="210" height="112" rx="15" fill="#102722" stroke="#397361"/>
 <text x="18" y="30" class="mint tiny">EDITORIAL REVIEW</text>
 <text x="18" y="58" class="t label">RSS / Atom queue</text><text x="18" y="82" class="m small">Review before approval</text><text x="18" y="100" class="m" font-size="10">No automatic news broadcast</text>
</g>
<g transform="translate(784 900)">
 <rect width="210" height="112" rx="15" fill="#102722" stroke="#397361"/>
 <text x="18" y="30" class="mint tiny">LANGUAGES</text>
 <text x="18" y="58" class="t label">TG · RU · EN</text><text x="18" y="82" class="m small">Three-language content</text><text x="18" y="100" class="m" font-size="10">Human translation review</text>
</g>
<g transform="translate(1016 900)">
 <rect width="336" height="112" rx="15" fill="#11253a" stroke="#4c77a8"/>
 <text x="18" y="30" class="blue tiny">OPTIONAL VOICE WORKER</text>
 <text x="18" y="58" class="t label">Approved text → MP3</text><text x="18" y="82" class="m small">TTS provider + media folder</text><text x="18" y="100" class="m" font-size="10">Operator configures AutoDJ playlists</text>
</g>
<!-- motion waveform footer -->
<path d="M88 1037h1264" stroke="#31564b" stroke-width="1"/>
<g transform="translate(640 1037)" stroke="#82efd4" stroke-width="3" stroke-linecap="round">
 <path d="M-60 0v-7 M-42 0v-15 M-24 0v-23 M-6 0v-12 M12 0v-27 M30 0v-15 M48 0v-8">
 <animate attributeName="d" values="M-60 0v-7 M-42 0v-15 M-24 0v-23 M-6 0v-12 M12 0v-27 M30 0v-15 M48 0v-8;M-60 0v-19 M-42 0v-9 M-24 0v-29 M-6 0v-6 M12 0v-16 M30 0v-26 M48 0v-13;M-60 0v-7 M-42 0v-15 M-24 0v-23 M-6 0v-12 M12 0v-27 M30 0v-15 M48 0v-8" dur="1.2s" repeatCount="indefinite"/>
 </path>
</g>
<text x="720" y="1090" text-anchor="middle" class="m" font-size="12">WAYLINE RADIO · COMPANY RADIO NETWORK FOR THE ROAD</text>
</svg>