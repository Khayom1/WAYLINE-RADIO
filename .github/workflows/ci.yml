name: WAYLINE CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: \${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: npm run check && bash -n scripts/ci-smoke.sh
      - name: Unit and policy tests
        run: npm test

  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Compose environment
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Start stack and verify an actual broadcast
        env:
          POSTGRES_PASSWORD: wayline-ci-postgres-password
          JWT_SECRET: wayline-ci-jwt-secret-0123456789abcdef0123456789abcdef0123456789abcdef
          ICECAST_SOURCE_PASSWORD: wayline-ci-icecast-source-0123456789
          ICECAST_ADMIN_PASSWORD: wayline-ci-icecast-admin-0123456789
        run: bash scripts/ci-smoke.sh
